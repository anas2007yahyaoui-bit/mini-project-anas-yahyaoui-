<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inscription</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <header>
        <div>
            <h1 style="color: white;"><span class="c1">HTS</span>HighTechStore</h1>
        </div>
        <div>
         <span class="c2">Acceuil</span>
         <a href="pages/pc.html" class="c2">PC</a>
         <span class="c1">Inscriptions</span>
         <span class="c2">Infos</span>
        </div>
    </header>
    <main>
        <section class="c7">
            <h2 class="h2">Formulaire D'inscription</h2>
            <form action="#" method="post">
                <div class="c9">
                    <div class="c8">
                     <label for="type">Nom :</label>
                     <input type="text" size="40px">
                    </div>
                    <div class="c8">
                     <label for="type">Prenom :</label>
                     <input type="text" size="40px">
                    </div>
                    <div class="c8">
                      <label for="naissance">Date de naissance :</label>
                      <input type="date" size="40px">
                    </div>
                </div>
                <div class="c9">
                    <div class="c8">
                      <label>Sex</label>
                      <div>
                         <label><input type="radio" size="40px"> Masculin</label>
                         <label><input type="radio" size="40px"> Féminin</label>
                        </div>
                    </div>
                    <div class="c8">
                      <label for="type">Adresse</label>
                      <input type="text" size="40px">
                    </div>
                </div>
                <div class="c9">
                    <div class="c8">
                      <label for="type">Ville</label>
                      <input type="text" size="40px">
                    </div>
                    <div class="c8">
                      <label for="text">Gouvernorat</label>
                       <input type="number" placeholder="Gouvernorat" size="40px">
                    </div>
                </div>
                <div class="c9">
                    <div class="c8">
                      <label for="type">Adresse E-mail</label>
                      <input type="text" placeholder="non@exemple.com" size="40px">
                    </div>
                    <div class="c8">
                       <label for="type">Numero de telephone</label>
                       <input type="number" size="40px">
                    </div>
                </div>
                <div>
                    <p class="c11">valider l'inscription</p>
                </div>
            </form>
        </section>

    </main>
    <footer>
        <p>© 2026 HighTechStore - Tous droits réservés | Auteur : yahyaoui anas</p>
    </footer>
</body>
</html>
